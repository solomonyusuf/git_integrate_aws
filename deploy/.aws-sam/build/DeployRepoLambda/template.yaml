AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Deploy GitHub repo folder to S3 (isolated API)

Globals:
  Function:
    Timeout: 900
    Runtime: nodejs18.x
    MemorySize: 512

Resources:
  DeployApiGateway:
    Type: AWS::Serverless::Api
    Properties:
      Name: DeployRepoApi
      StageName: Prod
      EndpointConfiguration: REGIONAL

  #Table for file uploads
  RepoUploadsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: RepoUploads
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
        - AttributeName: file_name
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
        - AttributeName: file_name
          KeyType: RANGE

  #Table for user info cache
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: Users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH

  DeployRepoLambda:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda_function.handler
      CodeUri: .
      Environment:
        Variables:
          BUCKET_NAME: integration-deploy-solomonyusuf
          DYNAMO_TABLE: RepoUploads
          USERS_TABLE: Users
      Policies:
        - S3FullAccessPolicy:
            BucketName: integration-deploy-solomonyusuf
        - DynamoDBCrudPolicy:
            TableName: RepoUploads
        - DynamoDBCrudPolicy:
            TableName: Users
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref DeployApiGateway
            Path: /deploy
            Method: get

Outputs:
  DeployRepoApiUrl:
    Description: API Gateway endpoint to deploy repo folder
    Value: !Sub "https://${DeployApiGateway}.execute-api.${AWS::Region}.amazonaws.com/Prod/deploy"
